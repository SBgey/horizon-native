name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup component add rust-src

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Show NDK path
        run: |
          echo "NDK=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_NDK_LATEST_HOME"

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: cargo apk build --release

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find target -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: apk-out
